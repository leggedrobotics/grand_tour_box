# The target sensor frame.
# AP20 do not have orientation so if we want to compare against that we have to convert to its sensor frame.
target_frame: prism
filter_by_covariance: False
covariance_percentile_threshold: 95 #percentile
#
remove_until_motion: True
distance_threshold: 10 #distance in meters
#
ap20_peak_rejection: True
ap20_velocity_rejection: True
ap20_velocity_rejection_threshold: 3.5 #m/s
ap20_peak_rejection_threshold: 0.1 #second
ap20_peak_rejection_trailing_window: 5 #trailing indices to remove
#
project_to_plane: "xyz" #xy or xyz

# If topic entry is left empty "", the bag only going to be used for /tf & /tf_static reading and not for topic reading
bag_topic_pairs:
    #
  - bag: _dlio.bag
    test_name: "dlio"
    topic: /boxi/dlio/lidar_map_odometry
    frame: hesai_lidar
    evaluations:
      parameters:
        t_max_diff: 0.005
        t_offset: 0.0
        n_to_align: -1
        correct_scale: False
        delta: 1
        unit: "m" #m or frame
      ape_rpe:
        reference_file: ""
      point_relation:
        reference_file: "ap20_robot"

    #
  - bag: _ap20_prism_position.bag
    test_name: "ap20_robot"
    topic: "/boxi/ap20/prism_position"
    frame: "prism"
    evaluations:
      parameters:
        t_max_diff: 0.025
        t_offset: 0.0
        n_to_align: -1
        correct_scale: False
        delta: 1
        unit: "m" #m or frame
      ape_rpe:
        reference_file: ""
      point_relation:
        reference_file: "ap20_robot"
    #
  - bag: _tf_model.bag
    test_name: ""
    topic: ""
    frame: ""