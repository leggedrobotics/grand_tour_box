gt_source: TPS
gt_pattern: "*_ap20_prism_position.bag"

# Practical rule (evo timestamp association):
#   t_max_diff ≈ 0.5 * median(Δt_long) (+ small margin for timestamp jitter)
#   where Δt_long is the timestep of the longer trajectory (typically the higher-rate one).
#   With AP20 at 20 Hz (Δt=0.05 s), any estimator ≤20 Hz typically needs t_max_diff ≈ 0.025 s.

# The target sensor frame.
# AP20 do not have orientation so if we want to compare against that we have to convert to its sensor frame.
target_frame: prism
filter_by_covariance: False
covariance_percentile_threshold: 95 #percentile
#
remove_until_motion: False
distance_threshold: 3 #distance in meters

ap20_velocity_rejection: False
ap20_velocity_rejection_threshold: 3.0 #m/s

#
ap20_peak_rejection: True
ap20_peak_rejection_threshold: 0.1 #second
ap20_peak_rejection_trailing_window: 5 #trailing indices to remove
#
project_to_plane: "xyz" #xy or xyz

# If topic entry is left empty "", the bag only going to be used for /tf & /tf_static reading and not for topic reading

# 10hz -> 0.025s
bag_topic_pairs:
  - bag: adaptive_lio_stim320.bag
    test_name: "adaptive_lio"
    topic: /odom
    frame: hesai_lidar
    evaluations:
      parameters:
        t_max_diff: 0.03
        t_offset: 0.0
        n_to_align: -1
        correct_scale: False
        delta: 0.5
        unit: "m" #m or frame
      ape_rpe:
        reference_file: ""
      point_relation:
        reference_file: "ap20_robot"

