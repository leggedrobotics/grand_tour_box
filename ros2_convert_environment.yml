# Core converters run without a ROS installation. Supply --inbag or --inmcap.
# Keep NumPy/OpenCV in one package manager to avoid overlapping binary installs.
name: boxi_ros2_convert
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    - mcap==1.3.0
    - rosbags==0.10.11
    - numpy==2.2.6
    - opencv-python==4.12.0.88
    - tqdm==4.67.1
